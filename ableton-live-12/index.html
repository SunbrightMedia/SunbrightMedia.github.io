<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ableton Live 12</title>
  <link rel="icon" href="../images/desktop/ableton-live-12.svg">
  <style>
    /* Live 12 default theme colours, sampled from Ableton's Live 12 screenshots */
    :root {
      --bg: #2a2a2a;         /* window background */
      --panel: #363636;      /* buttons, rulers, header controls */
      --lane: #323232;       /* empty arrangement lane */
      --lane-sel: #404040;   /* selected track lane */
      --sep: #242424;        /* separators */
      --dark: #1e1e1e;       /* solo/arm buttons, displays */
      --text: #b5b5b5;
      --text-hi: #e0e0e0;
      --text-dim: #7a7a7a;
      --orange: #ffad56;     /* track activator, device on */
      --teal: #027383;       /* volume field */
      --cyan: #03c3d5;       /* insert marker */
      --pan: #636363;
      --font: "Ableton Sans", "Ableton Sans Medium", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 12px/1.2 var(--font); user-select: none; -webkit-user-select: none; }
    button { font: inherit; color: inherit; }

    #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

    /* ---------- Control bar ---------- */
    #controlbar { height: 42px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px; background: var(--bg); white-space: nowrap; overflow: hidden; }
    .cb { height: 22px; min-width: 22px; padding: 0 7px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; background: var(--panel); color: var(--text); border-radius: 2px; flex: none; }
    .cb.num { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
    .cb.on { background: var(--orange); color: #1e1e1e; }
    .cb.dd::after { content: ""; border-top: 4px solid currentColor; border-left: 3px solid transparent; border-right: 3px solid transparent; margin-left: 2px; }
    .cb.ghost { background: transparent; }
    .cb svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.4; }
    .cb .play { width: 0; height: 0; border-left: 13px solid #10c47a; border-top: 8px solid transparent; border-bottom: 8px solid transparent; }
    .cb.playing .play { border-left-color: #12e08a; }
    .cb .stop { width: 14px; height: 14px; background: #b5b5b5; }
    .cb .rec { width: 15px; height: 15px; border-radius: 50%; background: #b5b5b5; }
    .gap { width: 14px; flex: none; }
    .flex { flex: 1; }
    #cb-scale-btn { background: #a78bfa; color: #1e1e1e; }
    #cb-cpu-bar { width: 6px; height: 14px; background: var(--orange); }
    .cb.clickable:hover { filter: brightness(1.15); }

    /* ---------- Arrangement ---------- */
    #arrangement { flex: 1; min-height: 0; display: flex; flex-direction: column; margin: 0 8px; background: var(--sep); border-radius: 3px 3px 0 0; overflow: hidden; position: relative; }
    #ruler-row { height: 40px; flex: none; display: flex; background: var(--panel); }
    #ruler { flex: 1; min-width: 0; position: relative; }
    #ruler canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #ruler-side { width: var(--hw); flex: none; display: flex; flex-direction: column; gap: 3px; padding: 3px 8px 0; overflow: hidden; }
    #ruler-side .row { display: flex; gap: 6px; }
    .pill { height: 16px; padding: 0 9px; display: inline-flex; align-items: center; border-radius: 9px; background: var(--dark); color: var(--text); }
    .sq { height: 16px; width: 30px; display: inline-flex; align-items: center; justify-content: center; border-radius: 2px; background: var(--dark); }
    .circ { width: 15px; height: 15px; border-radius: 50%; background: var(--dark); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; }

    #tracks-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .tscroll { position: relative; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
    .tscroll::-webkit-scrollbar { display: none; }
    #tracks { flex: 1; min-height: 0; }
    #pinned { flex: none; border-top: 2px solid var(--sep); }
    .lanes-canvas { position: sticky; top: 0; left: 0; display: block; }
    .rows { position: relative; }
    .trow { display: flex; }
    .trow .lane { flex: 1; min-width: 0; }
    .theader { width: var(--hw); flex: none; display: flex; border-bottom: 1px solid var(--sep); background: var(--bg); }
    .theader .name { width: 104px; flex: none; display: flex; align-items: flex-start; gap: 6px; padding: 3px 6px; color: #1a1a1a; overflow: hidden; }
    .theader .name span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; line-height: 13px; padding-top: 1px; }
    .theader .fold { width: 13px; height: 13px; flex: none; border-radius: 50%; border: 1.3px solid currentColor; display: grid; place-items: center; opacity: .85; }
    .theader .fold::after { content: ""; border-top: 4.5px solid currentColor; border-left: 3.2px solid transparent; border-right: 3.2px solid transparent; margin-top: 1px; }
    .theader.folded .fold::after { border-top: 3.2px solid transparent; border-bottom: 3.2px solid transparent; border-left: 4.5px solid currentColor; border-right: 0; margin: 0 0 0 1.5px; }
    .theader.group .fold::after, .theader.group.folded .fold::after { content: "≡"; border: 0; font-size: 10px; line-height: 1; margin: -1px 0 0; font-weight: bold; }
    .theader .ctrls { flex: 1; min-width: 0; display: grid; grid-template-columns: 46px 22px 22px; grid-auto-rows: 15px; gap: 2px 3px; padding: 3px 4px 3px 4px; align-content: start; background: var(--bg); }
    .theader .act { background: var(--orange); color: #1e1e1e; display: flex; align-items: center; justify-content: center; font-size: 11px; }
    .theader .act.off { background: #5a5a5a; color: #bdbdbd; }
    .theader .solo, .theader .arm { background: var(--dark); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text); }
    .theader .solo.on { background: #2f8ff6; color: #fff; }
    .theader .arm::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #6b6b6b; }
    .theader .vol { grid-column: 1; position: relative; background: var(--dark); font-size: 11px; display: flex; align-items: center; justify-content: center; color: #d6d6d6; overflow: hidden; }
    .theader .vol i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--teal); }
    .theader .vol b { position: relative; font-weight: normal; }
    .theader .panv { grid-column: 2 / span 2; background: var(--dark); display: flex; align-items: center; justify-content: center; font-size: 11px; }
    .theader .send { background: var(--dark); display: flex; align-items: center; justify-content: center; font-size: 11px; color: #9a9a9a; }
    .theader .meter { width: 10px; flex: none; display: flex; gap: 2px; padding: 3px 2px 3px 0; }
    .theader .meter i { flex: 1; background: var(--dark); position: relative; overflow: hidden; }
    .theader .meter i b { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(to top, #1ec95a, #1ec95a 70%, #e6d83a 88%, #f2502e); }
    .theader.sel .ctrls, .theader.sel .meter { background: #3a3a3a; }
    .theader.main .name { color: #1a1a1a; }

    #songruler { height: 20px; flex: none; display: flex; background: var(--panel); border-top: 1px solid var(--sep); }
    #songruler canvas { flex: 1; min-width: 0; height: 100%; }
    #songruler .side { width: var(--hw); flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 11px; }

    /* ---------- Detail view (devices) ---------- */
    #detail { height: 214px; flex: none; margin: 4px 8px 0; display: flex; background: var(--sep); border-radius: 3px; overflow: hidden; }
    #devices { flex: 1; min-width: 0; display: flex; gap: 3px; padding: 3px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; scrollbar-color: #555 transparent; }
    #devices .empty { margin: auto; color: var(--text-dim); }
    .device { flex: none; display: flex; flex-direction: column; background: var(--panel); border-radius: 2px; min-width: 150px; max-width: 620px; }
    .device.off { opacity: .55; }
    .device .dtitle { height: 20px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 6px; background: #2e2e2e; border-bottom: 1px solid var(--sep); color: var(--text-hi); white-space: nowrap; }
    .device .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--orange); flex: none; }
    .device.off .dot { background: #5a5a5a; }
    .device .dname { overflow: hidden; text-overflow: ellipsis; }
    .device .dkind { margin-left: auto; color: var(--text-dim); font-size: 10px; padding-left: 8px; }
    .device .dbody { flex: 1; min-height: 0; display: flex; }
    .device .params { display: grid; grid-auto-flow: column; grid-template-rows: repeat(6, 1fr); grid-auto-columns: 92px; gap: 2px 8px; padding: 6px 8px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; scrollbar-color: #555 transparent; }
    .device .param { min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .device .param .pn { font-size: 10px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .device .param .pv { font-size: 11px; color: var(--text-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .device .chains { width: 150px; flex: none; border-right: 1px solid var(--sep); overflow-y: auto; padding: 4px; scrollbar-width: thin; scrollbar-color: #555 transparent; }
    .device .chain { height: 18px; display: flex; align-items: center; gap: 5px; padding: 0 5px; border-radius: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .device .chain.sel { background: #4b4b4b; color: var(--text-hi); }
    .device .chain i { width: 8px; height: 8px; flex: none; border-radius: 1px; }
    .device .nested { display: flex; gap: 3px; padding: 4px; background: #2b2b2b; overflow-x: auto; scrollbar-width: thin; scrollbar-color: #555 transparent; }
    .device .nested .device { min-width: 130px; }
    .device .macros { display: grid; grid-template-columns: repeat(4, 64px); grid-auto-rows: 38px; gap: 4px; padding: 6px; }
    .device .macro { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .device .knob { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #5a5a5a; position: relative; }
    .device .knob::after { content: ""; position: absolute; left: 50%; top: 1px; width: 2px; height: 7px; margin-left: -1px; background: var(--orange); transform-origin: 50% 8px; transform: rotate(var(--r, 0deg)); }

    /* ---------- Status bar ---------- */
    #statusbar { height: 26px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px; }
    #statusbar .info { width: 15px; height: 15px; border-radius: 50%; background: #4a4a4a; color: #222; font: bold 10px/15px var(--font); text-align: center; }
    #status-text { flex: 1; min-width: 0; height: 18px; padding: 0 8px; display: flex; align-items: center; background: var(--panel); border-radius: 2px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #status-track { color: var(--text-hi); padding: 0 6px; }

    /* ---------- Open / loading overlay ---------- */
    #overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(30,30,30,.55); z-index: 10; }
    #overlay[hidden] { display: none; }
    .dialog { width: min(460px, calc(100vw - 32px)); padding: 22px; background: var(--panel); border: 1px solid #4a4a4a; border-radius: 4px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
    .dialog h1 { margin: 0 0 6px; font-size: 16px; color: var(--text-hi); font-weight: 600; }
    .dialog p { margin: 6px 0; line-height: 1.45; }
    .dialog .drop { margin-top: 14px; padding: 26px 12px; border: 1.5px dashed #6a6a6a; border-radius: 4px; color: var(--text-hi); }
    .dialog .drop.over { border-color: var(--orange); background: rgba(255,173,86,.08); }
    .dialog .btn { display: inline-block; margin-top: 12px; padding: 5px 14px; border-radius: 2px; background: var(--orange); color: #1e1e1e; }
    .dialog .bar { height: 6px; margin-top: 14px; background: var(--dark); border-radius: 3px; overflow: hidden; }
    .dialog .bar i { display: block; height: 100%; width: 0; background: var(--orange); transition: width .15s; }
    .dialog .err { color: #ff8a7a; }
    .dialog .list { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; text-align: left; }
    .dialog .list div { padding: 5px 8px; background: var(--dark); border-radius: 2px; }
    .dialog .list div:hover { background: #4b4b4b; }
    #file-input { display: none; }

    @media (max-width: 700px) {
      #controlbar .wide { display: none; }
      :root { --hw: 168px !important; }
      .theader .name { width: 72px; }
      #detail { height: 160px; }
    }
  </style>
</head>
<body>
  <div id="app" style="--hw: 236px">
    <div id="controlbar">
      <span class="cb ghost wide" title="Show/hide Browser"><svg viewBox="0 0 14 14"><rect x="1" y="2" width="5" height="10" fill="#4a4a4a" stroke="none"/><rect x="7" y="2" width="6" height="10" fill="#4a4a4a" stroke="none"/></svg></span>
      <span class="cb wide">Link</span>
      <span class="cb">Tap</span>
      <span class="cb num" id="cb-tempo">120.00</span>
      <span class="cb wide" title="Nudge"><svg viewBox="0 0 14 14"><path d="M2 2v10M4 2v10M6 2v10M9 2v10"/></svg></span>
      <span class="cb wide" title="Nudge"><svg viewBox="0 0 14 14"><path d="M5 2v10M8 2v10M10 2v10M12 2v10"/></svg></span>
      <span class="cb num" id="cb-sig">4 / 4</span>
      <span class="cb wide" title="Metronome">○●</span>
      <span class="cb dd wide" id="cb-quant">1 Bar</span>
      <span class="gap wide"></span>
      <span class="cb wide" id="cb-scale-btn" title="Scale">♭♯</span>
      <span class="cb dd wide" id="cb-root">C</span>
      <span class="cb dd wide" id="cb-scale">Major</span>
      <span class="gap wide"></span>
      <span class="cb wide clickable" id="cb-follow" title="Follow">→‒</span>
      <span class="cb num" id="cb-pos">1. 1. 1</span>
      <span class="cb ghost clickable" id="cb-play" title="Play"><i class="play"></i></span>
      <span class="cb ghost clickable" id="cb-stop" title="Stop"><i class="stop"></i></span>
      <span class="cb ghost wide" title="Arrangement Record"><i class="rec"></i></span>
      <span class="gap wide"></span>
      <span class="cb ghost wide">+</span>
      <span class="cb wide" title="Automation Arm">⟜</span>
      <span class="cb ghost wide">◂</span>
      <span class="cb ghost wide">⛶</span>
      <span class="cb ghost wide">○</span>
      <span class="gap wide"></span>
      <span class="cb num wide" id="cb-loopstart">1. 1. 1</span>
      <span class="cb wide" title="Punch-In">⌐</span>
      <span class="cb clickable" id="cb-loop" title="Loop Switch">⟲</span>
      <span class="cb wide" title="Punch-Out">¬</span>
      <span class="cb num wide" id="cb-looplen">4. 0. 0</span>
      <span class="flex"></span>
      <span class="cb wide" title="Draw Mode">✎</span>
      <span class="cb wide">Key</span>
      <span class="cb wide">MIDI</span>
      <span class="cb wide" id="cb-sr">44.1 kHz</span>
      <span class="cb wide"><i id="cb-cpu-bar"></i>&nbsp;0 %</span>
      <span class="cb clickable" id="cb-open" title="Open another Live Set (.zip)">Open</span>
    </div>

    <div id="arrangement">
      <div id="ruler-row">
        <div id="ruler"><canvas id="ruler-canvas"></canvas></div>
        <div id="ruler-side">
          <div class="row"><span class="pill">Set</span><span class="sq">⤢</span><span class="sq">🔒︎</span></div>
          <div class="row"><span class="circ">←</span><span class="circ">→</span></div>
        </div>
      </div>
      <div id="tracks-wrap">
        <div id="tracks" class="tscroll"><canvas class="lanes-canvas" id="lanes-canvas"></canvas><div class="rows" id="rows"></div></div>
        <div id="pinned" class="tscroll"><canvas class="lanes-canvas" id="pinned-canvas"></canvas><div class="rows" id="pinned-rows"></div></div>
      </div>
      <div id="songruler"><canvas id="song-canvas"></canvas><div class="side"><span class="sq" style="width:22px">⦀</span><span class="sq" style="width:40px" id="zoom-label">1.00x</span><span class="sq" style="width:18px">H</span><span class="sq" style="width:18px">W</span></div></div>

      <div id="overlay">
        <div class="dialog" id="dialog"></div>
      </div>
    </div>

    <div id="detail"><div id="devices"><div class="empty">Select a track to see its devices</div></div></div>

    <div id="statusbar">
      <span class="info">i</span>
      <span id="status-text"></span>
      <span id="status-track"></span>
    </div>
  </div>
  <input type="file" id="file-input" accept=".zip,application/zip">

  <script src="vendor/fflate.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
