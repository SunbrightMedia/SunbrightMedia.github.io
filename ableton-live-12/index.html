<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ableton Live 12</title>
<link rel="icon" href="images/live-app-32.png">
<link rel="stylesheet" href="player/player.css?v=63f9d5ca">
</head>
<body>
<div id="app">
  <header id="bar">
    <button id="proj" class="pill" title="Projects"><span id="proj-name">Projects</span><i class="tri"></i></button>
    <div id="proj-menu" hidden></div>
    <span class="sep"></span>
    <button id="play" class="tbtn" title="Play (Space)" aria-label="Play"><svg viewBox="0 0 14 14"><path d="M2 1l11 6-11 6z"/></svg></button>
    <button id="stop" class="tbtn" title="Stop" aria-label="Stop"><svg viewBox="0 0 14 14"><path d="M2 2h10v10H2z"/></svg></button>
    <span class="lcd" id="pos">1. 1. 1</span>
    <span class="lcd" id="tempo">120.00</span>
    <span class="sep"></span>
    <button id="loop" class="tog" title="Loop" aria-label="Loop"><svg viewBox="0 0 14 14"><path d="M3 4h7V2l3 3-3 3V6H4v3H2V5a1 1 0 0 1 1-1zm8 6H4v2l-3-3 3-3v2h6V5h2v4a1 1 0 0 1-1 1z"/></svg></button>
    <button id="follow" class="tog on" title="Follow" aria-label="Follow"><svg viewBox="0 0 14 14"><path d="M1 6h8V3l4 4-4 4V8H1z"/></svg></button>
    <span id="zoom"><button id="zout" title="Zoom out" aria-label="Zoom out">&minus;</button><button id="zin" title="Zoom in" aria-label="Zoom in">+</button></span>
    <div id="load"><i></i></div>
    <div id="msg" hidden></div>
  </header>
  <main id="scroller">
    <div id="content">
      <div id="rulerrow"><div class="corner"></div><div id="ruler"><div id="brace"><i class="h l"></i><i class="h r"></i></div></div></div>
      <div id="grid"></div>
      <div id="rows"></div>
      <div id="below"><div class="corner"></div></div>
      <div class="loopline" id="ll0"></div><div class="loopline" id="ll1"></div>
      <div id="insert"></div><div id="playhead"></div>
    </div>
  </main>
  <footer id="master"></footer>
</div>
<script src="vendor/fflate.js?v=d85498a4"></script>
<script src="player/core.js?v=d296d6bf"></script>
<script src="player/meter.js?v=dac5cd04"></script>
<script src="player/player.js?v=e83a5b65"></script>
</body>
</html>
