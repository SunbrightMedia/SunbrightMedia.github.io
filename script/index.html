<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Font Lab</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000; --fg: #fff; --mute: #8c8c8c; --dim: #4d4d4d; --line: #1c1c1c; --line2: #2e2e2e;
    --hover: #0e0e0e; --sel: #1a1a1a; --err: #ff6161; --gizmo: #4da3ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; grid-template-columns: 300px 1fr; }
  button, input, select, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line2); border-radius: 4px; padding: 4px 7px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #777; }
  button { cursor: pointer; }
  button:hover { border-color: #666; }
  input[type=range] { accent-color: #fff; padding: 0; border: 0; background: none; }
  input[type=checkbox] { accent-color: #fff; }
  input[type=color] { padding: 1px 2px; width: 44px; height: 26px; }
  textarea { width: 100%; resize: vertical; min-height: 54px; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .ghost { border: 0; background: none; color: var(--mute); padding: 3px 6px; }
  .ghost:hover { color: var(--fg); }

  /* side panel */
  #side { border-right: 1px solid var(--line); overflow: auto; height: 100vh; padding: 10px 10px 40px; }
  .sh { display: flex; align-items: center; justify-content: space-between; color: var(--mute); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin: 2px 4px 6px; }
  .item { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 4px; cursor: pointer; user-select: none; }
  .item:hover { background: var(--hover); }
  .item.sel { background: var(--sel); }
  .item .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .sub { color: var(--mute); }
  .item.off .name { color: var(--dim); }
  .item .dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--fg); background: var(--fg); flex: none; padding: 0; }
  .item.off .dot { background: transparent; border-color: var(--dim); }
  .item .glyph { width: 10px; text-align: center; font-weight: 600; flex: none; }
  .item .dot.fx { width: 8px; height: 8px; border-radius: 1px; transform: rotate(45deg); margin: 0 1px; }
  .item .dot.tr { border-radius: 2px; width: 9px; height: 9px; }
  .curve { margin-top: 6px; }
  .tiles { display: flex; gap: 3px; }
  .tile { flex: 1 1 0; min-width: 0; height: 24px; padding: 1px; border-radius: 4px; color: var(--mute); }
  .tile svg path { stroke: #9a9a9a; }
  .tile:hover svg path, .tile.sel svg path { stroke: #fff; }
  .tile.sel { border-color: #fff; }
  .ends { display: flex; justify-content: space-between; color: var(--mute); font-size: 11px; margin-top: 2px; }
  .f.top > label { align-self: start; padding-top: 5px; }
  .f .note { grid-column: 2; color: var(--mute); font-size: 11px; }
  .f.dim > label, .f.dim select { opacity: 0.4; }
  .ghost.on { color: var(--fg); }
  .swatch { width: 26px; height: 10px; border-radius: 2px; flex: none; image-rendering: auto; }
  .swatch.big { display: block; width: 100%; height: 22px; margin: 0 0 10px; }
  .owner.nohover { cursor: default; }
  .owner.nohover:hover { color: var(--mute); }
  .sh.sect { margin-top: 16px; }
  .owner { color: var(--mute); font-size: 11px; padding: 6px 8px 2px; cursor: pointer; user-select: none; }
  .owner:hover { color: var(--fg); }
  .empty { color: var(--dim); font-size: 12px; padding: 4px 8px; }
  .ih .sub { color: var(--mute); font-weight: 400; font-size: 12px; }
  .mutedlist { color: var(--mute); font-size: 12px; }
  button:disabled { opacity: 0.35; cursor: default; }
  .item .bad { width: 6px; height: 6px; border-radius: 50%; background: var(--err); flex: none; }

  #insp { border-top: 1px solid var(--line); margin-top: 10px; padding: 12px 4px 0; }
  #insp:empty { display: none; }
  .ih { display: flex; align-items: center; gap: 4px; margin-bottom: 10px; }
  .ih b { flex: 1; font-size: 14px; font-weight: 600; }
  .f { display: grid; grid-template-columns: 76px 1fr; gap: 4px 8px; align-items: center; margin: 7px 0; }
  .f > label { color: var(--mute); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .f input[type=text], .f select { width: 100%; min-width: 0; }
  .f .err { border-color: var(--err); }
  .f .msg { grid-column: 2; color: var(--err); font-size: 11px; }
  .row { display: flex; gap: 6px; align-items: center; min-width: 0; }
  .row > input[type=range] { flex: 1 1 60%; min-width: 50px; }
  .row > input[type=text], .row > input[type=number] { flex: 1 1 40%; min-width: 0; width: 100%; }
  .row.xy > input[type=text] { flex: 1 1 50%; }
  .row > select { flex: 1; min-width: 0; }
  details { margin-top: 10px; }
  summary { color: var(--mute); cursor: pointer; font-size: 12px; }
  summary:hover { color: var(--fg); }
  .help { color: var(--mute); font-size: 12px; }
  .help code { color: var(--fg); font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }

  /* top bar and menus */
  #main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  #bar { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  #play { width: 34px; padding: 4px 0; }
  #time { flex: 1; max-width: 420px; }
  #tLabel { color: var(--mute); min-width: 52px; }
  .spacer { flex: 1; }
  .dd { position: relative; }
  .menu { position: fixed; z-index: 20; min-width: 210px; overflow-y: auto; background: #0a0a0a; border: 1px solid var(--line2); border-radius: 6px; padding: 5px; box-shadow: 0 8px 30px #000; }
  .menu button, .menu label.mi { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
  .menu button:hover, .menu label.mi:hover { background: var(--sel); }
  .menu .mi input[type=checkbox] { margin: 0; }
  .menu .mi span { flex: 1; }
  .menu .mi select, .menu .mi input[type=number] { width: 90px; }
  .menu hr { border: 0; border-top: 1px solid var(--line2); margin: 5px 2px; }
  .menu .mh { color: var(--mute); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 6px 8px 3px; }

  /* stage */
  #stageWrap { flex: 1; position: relative; min-height: 0; background: #000; overflow: hidden; }
  #stageWrap > svg, #stageWrap > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #svg, #maskCv, #gl { pointer-events: none; }
  #maskCv { display: none; }
  #ui { touch-action: none; cursor: grab; }
  #toast { position: absolute; left: 12px; bottom: 10px; color: var(--mute); font-size: 12px; pointer-events: none; transition: opacity .4s; }
  #toast.err { color: var(--err); }
  #stats { position: absolute; right: 12px; bottom: 10px; color: var(--dim); font: 11px ui-monospace, Consolas, monospace; pointer-events: none; }

  #drop { position: fixed; inset: 0; background: rgba(255,255,255,.08); border: 2px dashed #fff; display: none; align-items: center; justify-content: center; font-size: 18px; z-index: 30; pointer-events: none; }
  body.dragging #drop { display: flex; }

  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: 52vh auto; }
    #main { height: 52vh; order: -1; }
    #side { height: auto; border-right: 0; border-top: 1px solid var(--line); }
    #time { max-width: none; }
  }
</style>
</head>
<body>
<aside id="side">
  <div class="sh"><span>Scripts</span><button class="ghost" id="addScript" title="Add a script">+ Script</button></div>
  <div id="list"></div>
  <div class="sh sect"><span>Effects</span>
    <div class="dd"><button class="ghost" data-menu="fxMenu" title="Effects are latched to a script or a group">+ Effect</button></div>
  </div>
  <div id="fxList"></div>
  <div class="sh sect"><span>Transitions</span>
    <div class="dd"><button class="ghost" data-menu="trMenu" title="Transitions animate text appearing, disappearing or changing; they are latched to a script">+ Transition</button></div>
  </div>
  <div id="trList"></div>
  <div class="sh sect"><span>Modifiers</span>
    <div class="dd"><button class="ghost" data-menu="modMenu" title="Modifiers act on whatever script they touch">+ Modifier</button></div>
  </div>
  <div id="modList"></div>
  <div class="sh sect"><span>Schemes</span></div>
  <div id="schemeList"></div>
  <div id="insp"></div>
</aside>
<div class="menu" id="modMenu" hidden></div>
<div class="menu" id="fxMenu" hidden></div>
<div class="menu" id="trMenu" hidden></div>

<main id="main">
  <div id="bar">
    <button id="play" title="Play / pause (space)">❚❚</button>
    <input type="range" id="time" min="0" max="20" step="0.01" title="Time">
    <span id="tLabel" class="mono">0.00s</span>
    <span class="spacer"></span>
    <div class="dd"><button class="ghost" data-menu="viewMenu">View</button>
      <div class="menu" id="viewMenu" hidden>
        <button id="fit">Fit to text</button>
        <hr>
        <label class="mi"><input type="checkbox" id="gizmos"><span>Gizmos</span></label>
        <label class="mi"><input type="checkbox" id="maskView"><span>Mask view</span></label>
        <label class="mi"><input type="checkbox" id="statsOn"><span>Stats</span></label>
        <hr>
        <label class="mi"><span>Structure</span><select id="overlay"><option value="">off</option></select></label>
        <label class="mi"><span>Speed</span><input type="number" id="speed" step="0.1"></label>
      </div>
    </div>
    <div class="dd"><button class="ghost" data-menu="fileMenu">File</button>
      <div class="menu" id="fileMenu" hidden>
        <button id="exportSvg">Export frame as SVG</button>
        <button id="exportPng">Export frame as PNG</button>
        <button id="exportGlyphs">Export font as SVG glyphs</button>
        <hr>
        <button id="saveProj">Save project</button>
        <button id="openProj">Open project…</button>
        <hr>
        <button id="reset">Reset</button>
        <div class="mh" id="build"></div>
      </div>
    </div>
  </div>
  <div id="stageWrap">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"><g id="scene"></g></svg>
    <canvas id="maskCv"></canvas>
    <svg id="ui" xmlns="http://www.w3.org/2000/svg"><g id="overlayG"></g><g id="gizmoG"></g></svg>
    <div id="toast"></div>
    <div id="stats" hidden></div>
  </div>
</main>

<input type="file" id="fontFile" accept=".ttf,.otf,.woff" multiple hidden>
<input type="file" id="projFile" accept=".json" hidden>
<div id="drop">Drop font files</div>

<template id="helpTpl">
  <div class="help">
    <p>Each field is an expression, worked out once per element of the modifier's level (per point for Displace, once per frame for Warp).</p>
    <p><code>i</code> index · <code>n</code> count · <code>u</code> 0..1 along the level · <code>t</code> seconds · <code>size</code> font size<br>
      <code>x y</code> centre, or point position · <code>w h</code> box size<br>
      <code>li wi gi ci</code> line, word, glyph, contour index · <code>pi</code> point index · <code>ctrl</code> curve handle · <code>ch</code> char code</p>
    <p>Math without the prefix (<code>sin abs pow PI</code> …), <code>rnd(a,b)</code> <code>noise(x,y)</code> <code>fbm</code> <code>clamp</code> <code>lerp</code> <code>smoothstep</code> <code>fract</code> <code>tri</code> <code>saw</code> <code>ease</code> <code>hsl(h,s,l)</code> <code>rgb(r,g,b)</code></p>
    <p>Colours also take plain text: <code>#f80</code>, <code>none</code>, <code>red</code>.</p>
  </div>
</template>

<!-- Bump ?v= whenever a script changes: GitHub Pages lets browsers cache files for 10 minutes,
     and the version keeps a new page from running next to old cached scripts. -->
<script src="lib/opentype.min.js?v=2026-11-18.13"></script>
<script src="shapes.js?v=2026-11-18.13"></script>
<script src="schemes.js?v=2026-11-18.13"></script>
<script src="engine.js?v=2026-11-18.13"></script>
<script src="strokes.js?v=2026-11-18.13"></script>
<script src="transitions.js?v=2026-11-18.13"></script>
<script src="gl.js?v=2026-11-18.13"></script>
<script src="app.js?v=2026-11-18.13"></script>
</body>
</html>
