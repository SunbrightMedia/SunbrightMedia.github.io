<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <!-- 7.css by Khang Nguyen Duy, MIT License (see css/7.css.LICENSE) -->
  <link rel="stylesheet" href="css/7.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { font: 9pt "Segoe UI", Tahoma, sans-serif; background: #1a6fc9; user-select: none; }

    /* ---------- Desktop ---------- */
    #desktop {
      position: fixed; inset: 0;
      background: #1a6fc9 url("images/wallpaper.jpg") center / cover no-repeat;
    }

    /* Desktop icons (add your own in #icons) */
    #icons { position: absolute; top: 4px; left: 4px; bottom: 44px; display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; gap: 2px; }
    .icon {
      width: 76px; padding: 4px 2px; text-align: center; color: #fff; cursor: default;
      border: 1px solid transparent; border-radius: 3px; text-shadow: 0 0 3px #000, 0 1px 2px #000;
    }
    .icon:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.3); }
    .icon.selected { background: rgba(130,190,255,.35); border-color: rgba(190,225,255,.7); }
    .icon img { display: block; width: 48px; height: 48px; margin: 0 auto 3px; }

    /* Windows: 7.css provides the look; these just make them float on the desktop */
    .window.app { position: absolute; display: flex; flex-direction: column; min-width: 200px; min-height: 100px; }
    .window.app[hidden] { display: none; }
    .window.app .title-bar { cursor: default; touch-action: none; }
    .window.app .window-body { flex: 1; overflow: auto; user-select: text; }

    /* ---------- Taskbar ---------- */
    #taskbar {
      position: fixed; left: 0; right: 0; bottom: 0; height: 40px; display: flex; align-items: center; z-index: 9999;
      background: linear-gradient(rgba(25,45,75,.55), rgba(10,20,40,.72));
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255,255,255,.35);
      box-shadow: inset 0 1px 0 rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.08);
    }
    #start {
      width: 54px; height: 54px; flex: none; margin: -14px 2px 0 2px; padding: 0; border: 0; cursor: pointer;
      background: url("images/start-orb.png") 0 0 / 54px 162px no-repeat;
    }
    #start:hover { background-position: 0 -54px; }
    #start:active, #start.open { background-position: 0 -108px; }

    .task { display: flex; align-items: center; cursor: default; }
    #tasks { flex: 1; display: flex; gap: 3px; height: 100%; padding: 2px 4px; overflow: hidden; }
    .task {
      width: 160px; min-width: 0; padding: 0 10px; border: 1px solid rgba(0,0,0,.55); border-radius: 3px;
      color: #fff; font: 9pt "Segoe UI", sans-serif; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 0 3px #000;
      background: linear-gradient(rgba(255,255,255,.22), rgba(255,255,255,.08) 50%, rgba(255,255,255,.02) 50%, rgba(255,255,255,.12));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.3);
    }
    .task:hover { background: linear-gradient(rgba(255,255,255,.35), rgba(255,255,255,.15) 50%, rgba(255,255,255,.08) 50%, rgba(255,255,255,.25)); }
    .task.active { background: linear-gradient(rgba(255,255,255,.4), rgba(255,255,255,.2) 50%, rgba(140,200,255,.15) 50%, rgba(140,200,255,.35)); }

    #tray { display: flex; align-items: center; height: 100%; color: #fff; text-shadow: 0 0 3px #000; }
    #clock { padding: 0 10px; text-align: center; line-height: 1.35; }
    #showdesk {
      width: 15px; height: 100%; margin-left: 4px; padding: 0; border: 0; border-left: 1px solid rgba(0,0,0,.5);
      background: linear-gradient(90deg, rgba(255,255,255,.25), rgba(255,255,255,.08));
      box-shadow: inset 1px 0 0 rgba(255,255,255,.3); cursor: pointer;
    }
    #showdesk:hover { background: linear-gradient(90deg, rgba(255,255,255,.5), rgba(255,255,255,.2)); }

    /* ---------- Start menu (add your own items in .left .items / .right) ---------- */
    #startmenu {
      position: fixed; left: 0; bottom: 40px; width: 400px; max-width: 100vw; height: 500px; max-height: calc(100vh - 40px); z-index: 10000;
      display: flex; padding: 8px; gap: 8px;
      border: 1px solid rgba(0,0,0,.7); border-radius: 6px 6px 0 0;
      background: linear-gradient(rgba(40,70,110,.75), rgba(20,35,60,.85));
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.35), 0 0 15px rgba(0,0,0,.5);
    }
    #startmenu[hidden] { display: none; }
    #startmenu .left {
      flex: 1.4; display: flex; flex-direction: column; background: #fff; border: 1px solid rgba(0,0,0,.6); border-radius: 4px;
      box-shadow: 0 0 0 1px rgba(255,255,255,.4);
    }
    #startmenu .items { flex: 1; padding: 4px; }
    #startmenu .search { margin: 6px; }
    #startmenu .search input { width: 100%; }
    #startmenu .right { flex: 1; display: flex; flex-direction: column; padding: 4px 0; color: #fff; text-shadow: 0 0 3px #000; }
    #startmenu a { display: block; padding: 6px 8px; color: inherit; text-decoration: none; border: 1px solid transparent; border-radius: 3px; }
    #startmenu .left a:hover { background: linear-gradient(#f2f8fe, #d6e9fd); border-color: #a8d8f7; }
    #startmenu .right a:hover { background: linear-gradient(rgba(255,255,255,.25), rgba(255,255,255,.1)); border-color: rgba(255,255,255,.4); }
    /* ---------- Notification balloon (7.css [role=tooltip], tail pointing down at the tray) ---------- */
    #notify {
      position: fixed; right: 10px; bottom: 58px; z-index: 10001; max-width: calc(100vw - 20px);
      display: flex; align-items: center; gap: 10px; padding: 12px 34px 12px 12px;
      font: 9pt "Segoe UI", Tahoma, sans-serif; color: #000;
      opacity: 1; transition: opacity .4s;
    }
    #notify[hidden] { display: none; }
    #notify.fading { opacity: 0; }
    #notify img { width: 32px; height: 32px; flex: none; }
    #notify .text { font-weight: bold; }
    #notify .close {
      position: absolute; top: 5px; right: 5px; width: 18px; height: 18px; border: 1px solid transparent; border-radius: 3px;
      display: grid; place-items: center; cursor: default; color: #666; font: 13px/1 "Segoe UI", Tahoma, sans-serif;
    }
    #notify .close:hover { color: #000; border-color: #b8b8b8; background: linear-gradient(#fff, #e3e3e3); }
    #notify .close:active { background: linear-gradient(#e3e3e3, #f5f5f5); }

    #start, .task, #showdesk, .icon, #notify .close { -webkit-tap-highlight-color: transparent; outline: none; }
    #start:focus-visible, .task:focus-visible, #showdesk:focus-visible, .icon:focus-visible { outline: 1px dotted #fff; }
    #notify .close:focus-visible { outline: 1px dotted #000; }

    /* ---------- Mobile ---------- */
    @media (max-width: 640px) {
      /* Windows open full-screen above the taskbar */
      .window.app { left: 0 !important; top: 0 !important; width: 100% !important; height: calc(100% - 40px) !important; min-width: 0; }
      .window.app .title-bar-controls button[aria-label="Maximize"],
      .window.app .title-bar-controls button[aria-label="Restore"] { display: none; }

      /* Bigger tap targets for icons */
      #icons { gap: 8px; top: 8px; left: 8px; }
      .icon { width: 84px; padding: 6px 2px; }

      /* Taskbar: buttons share the space */
      .task { width: auto; flex: 1 1 0; max-width: 140px; padding: 0 8px; }
      #showdesk { width: 12px; }

      /* Start menu spans the screen */
      #startmenu { width: 100%; height: 70vh; border-radius: 0; }
    }
  </style>
</head>
<body>

  <div id="desktop">
    <div id="icons">
      <!--
        Desktop icon template. data-open is the id of the window it opens.
        <div class="icon" data-open="win-example"><img src="images/icon.png" alt=""><span>Label</span></div>
      -->
    </div>

    <!--
      Window template (styled by 7.css). Give it an id, a position and a size.
      Add `hidden` to keep it closed until its icon is double-clicked.

      <div class="window glass active app" id="win-example" style="left:120px; top:60px; width:460px; height:320px">
        <div class="title-bar">
          <div class="title-bar-text">Title</div>
          <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
          </div>
        </div>
        <div class="window-body has-space">
          Content
        </div>
      </div>
    -->
  </div>

  <div id="startmenu" hidden>
    <div class="left">
      <div class="items"></div>
      <div class="search"><input type="search" aria-label="Search"></div>
    </div>
    <div class="right"></div>
  </div>

  <!-- Mobile-only notification (shown by the script below) -->
  <div id="notify" role="tooltip" class="is-top is-left" hidden>
    <img src="images/info.png" alt="">
    <span class="text">Best viewed on desktop</span>
    <div class="close" tabindex="0" aria-label="Close">✕</div>
  </div>

  <div id="taskbar">
    <div id="start" tabindex="0" aria-label="Start"></div>
    <div id="tasks"></div>
    <div id="tray"><div id="clock"></div><div id="showdesk" tabindex="0" aria-label="Show desktop"></div></div>
  </div>

  <script>
    // Taskbar items are plain divs (7.css restyles buttons and [role=button]); make Enter/Space click them
    document.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('#start, .task, #showdesk, #notify .close')) { e.preventDefault(); e.target.click(); }
    });

    // Clock (time over date)
    const clock = document.getElementById('clock');
    // Real day, month and time, but the year always shows as 2014
    const dateFmt = new Intl.DateTimeFormat();
    const tick = () => {
      const d = new Date();
      const date = dateFmt.formatToParts(d).map(p => p.type === 'year' ? '2014' : p.value).join('');
      clock.innerHTML = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '<br class="date"><span class="date">' + date + '</span>';
    };
    tick(); setInterval(tick, 10000);

    // Start menu
    const start = document.getElementById('start'), menu = document.getElementById('startmenu');
    start.onclick = e => { e.stopPropagation(); menu.hidden = !menu.hidden; start.classList.toggle('open', !menu.hidden); };
    document.addEventListener('mousedown', e => {
      if (!menu.hidden && !menu.contains(e.target) && e.target !== start) { menu.hidden = true; start.classList.remove('open'); }
    });

    // Phone layout (matches the CSS breakpoint); touch devices open icons with one tap
    const isPhone = () => matchMedia('(max-width: 640px)').matches;
    const singleTap = () => matchMedia('(max-width: 640px), (pointer: coarse)').matches;

    // Mobile notification: appears shortly after load, closes after 5 seconds,
    // on its close button, or when any other button is pressed
    const notify = document.getElementById('notify');
    let notifyTimer;
    function hideNotify() {
      if (notify.hidden || notify.classList.contains('fading')) return;
      clearTimeout(notifyTimer);
      notify.classList.add('fading');
      setTimeout(() => { notify.hidden = true; }, 400);
    }
    if (isPhone()) {
      setTimeout(() => {
        notify.hidden = false;
        notifyTimer = setTimeout(hideNotify, 5000);
      }, 800);
    }
    notify.querySelector('.close').addEventListener('click', hideNotify);
    document.addEventListener('pointerdown', e => {
      if (!notify.hidden && !notify.contains(e.target) &&
          e.target.closest('button, a, input, #start, .task, #showdesk, .icon')) hideNotify();
    }, true);

    // Windows
    const tasks = document.getElementById('tasks');
    let z = 10;
    function focusWin(w) {
      document.querySelectorAll('.window.app').forEach(o => o.classList.toggle('active', o === w));
      document.querySelectorAll('.task').forEach(t => t.classList.toggle('active', t._win === w));
      w.style.zIndex = ++z;
    }
    function taskFor(w) {
      if (w._task) return w._task;
      const t = document.createElement('div');
      t.className = 'task'; t._win = w; t.tabIndex = 0;
      t.textContent = w.querySelector('.title-bar-text')?.textContent.trim() || '';
      t.onclick = () => {
        if (w.hidden) { w.hidden = false; focusWin(w); }
        else if (t.classList.contains('active')) { w.hidden = true; t.classList.remove('active'); }
        else focusWin(w);
      };
      tasks.appendChild(t);
      return (w._task = t);
    }
    function openWin(w) { w.hidden = false; taskFor(w); focusWin(w); }

    document.querySelectorAll('.window.app').forEach(w => {
      if (!w.hidden) taskFor(w);
      w.addEventListener('mousedown', () => focusWin(w));
      const bar = w.querySelector('.title-bar');
      const btn = l => w.querySelector(`.title-bar-controls button[aria-label="${l}"]`);
      bar.addEventListener('pointerdown', e => {
        if (e.target.closest('button') || w.dataset.max || isPhone()) return;
        const dx = e.clientX - w.offsetLeft, dy = e.clientY - w.offsetTop;
        const move = ev => { w.style.left = ev.clientX - dx + 'px'; w.style.top = Math.max(0, ev.clientY - dy) + 'px'; };
        const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
        addEventListener('pointermove', move); addEventListener('pointerup', up);
      });
      btn('Minimize')?.addEventListener('click', () => { w.hidden = true; w._task?.classList.remove('active'); });
      btn('Close')?.addEventListener('click', () => { w.hidden = true; w._task?.remove(); w._task = null; });
      const toggleMax = () => {
        const m = btn('Maximize') || btn('Restore');
        if (w.dataset.max) { w.style.cssText = w.dataset.max; delete w.dataset.max; m?.setAttribute('aria-label', 'Maximize'); }
        else {
          w.dataset.max = w.style.cssText;
          Object.assign(w.style, { left: 0, top: 0, width: '100%', height: 'calc(100% - 40px)' });
          m?.setAttribute('aria-label', 'Restore');
        }
        focusWin(w);
      };
      (btn('Maximize') || btn('Restore'))?.addEventListener('click', toggleMax);
      bar.addEventListener('dblclick', e => { if (!e.target.closest('button') && !isPhone()) toggleMax(); });
    });
    const wins = [...document.querySelectorAll('.window.app:not([hidden])')];
    if (wins.length) focusWin(wins[wins.length - 1]);

    // Show desktop: minimize everything
    document.getElementById('showdesk').onclick = () => document.querySelectorAll('.window.app').forEach(w => {
      w.hidden = true; w._task?.classList.remove('active');
    });

    // Desktop icons: click to select, double-click to open
    document.querySelectorAll('.icon').forEach(i => {
      const open = () => { const w = document.getElementById(i.dataset.open); if (w) openWin(w); };
      i.addEventListener('click', () => {
        document.querySelectorAll('.icon').forEach(o => o.classList.toggle('selected', o === i));
        if (singleTap()) open();
      });
      i.addEventListener('dblclick', () => { if (!singleTap()) open(); });
    });
    document.getElementById('desktop').addEventListener('mousedown', e => {
      if (!e.target.closest('.icon')) document.querySelectorAll('.icon').forEach(o => o.classList.remove('selected'));
    });
  </script>
</body>
</html>
