<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <!-- 7.css by Khang Nguyen Duy, MIT License (see css/7.css.LICENSE) -->
  <link rel="stylesheet" href="css/7.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { font: 9pt "Segoe UI", Tahoma, sans-serif; background: #1a6fc9; user-select: none; }

    /* ---------- Desktop ---------- */
    #desktop {
      position: fixed; inset: 0;
      background: #1a6fc9 url("images/wallpaper.jpg") center / cover no-repeat;
    }

    /* Desktop icons (add your own in #icons) */
    #icons { position: absolute; top: 4px; left: 4px; bottom: 44px; display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; gap: 2px; }
    .icon {
      width: 76px; padding: 4px 2px; text-align: center; color: #fff; cursor: default;
      border: 1px solid transparent; border-radius: 3px; text-shadow: 0 0 3px #000, 0 1px 2px #000;
    }
    .icon:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.3); }
    .icon.selected { background: rgba(130,190,255,.35); border-color: rgba(190,225,255,.7); }
    .icon img { display: block; width: 48px; height: 48px; margin: 0 auto 3px; }

    /* Windows: 7.css provides the look; these just make them float on the desktop */
    .window.app { position: absolute; display: flex; flex-direction: column; min-width: 200px; min-height: 100px; }
    .window.app[hidden] { display: none; }
    .window.app .title-bar { cursor: default; touch-action: none; }
    .window.app .window-body { flex: 1; overflow: auto; user-select: text; }

    /* ---------- Taskbar ---------- */
    #taskbar {
      position: fixed; left: 0; right: 0; bottom: 0; height: 40px; display: flex; align-items: center; z-index: 9999;
      background: linear-gradient(rgba(25,45,75,.55), rgba(10,20,40,.72));
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255,255,255,.35);
      box-shadow: inset 0 1px 0 rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.08);
    }
    #start {
      width: 54px; height: 54px; flex: none; margin: -14px 2px 0 2px; padding: 0; border: 0; cursor: pointer;
      background: url("images/start-orb.png") 0 0 / 54px 162px no-repeat;
    }
    #start:hover { background-position: 0 -54px; }
    #start:active, #start.open { background-position: 0 -108px; }

    .task { display: flex; align-items: center; cursor: default; }
    #tasks { flex: 1; display: flex; gap: 3px; height: 100%; padding: 2px 4px; overflow: hidden; }
    .task {
      width: 160px; min-width: 0; padding: 0 10px; border: 1px solid rgba(0,0,0,.55); border-radius: 3px;
      color: #fff; font: 9pt "Segoe UI", sans-serif; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 0 3px #000;
      background: linear-gradient(rgba(255,255,255,.22), rgba(255,255,255,.08) 50%, rgba(255,255,255,.02) 50%, rgba(255,255,255,.12));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.3);
    }
    .task:hover { background: linear-gradient(rgba(255,255,255,.35), rgba(255,255,255,.15) 50%, rgba(255,255,255,.08) 50%, rgba(255,255,255,.25)); }
    .task.active { background: linear-gradient(rgba(255,255,255,.4), rgba(255,255,255,.2) 50%, rgba(140,200,255,.15) 50%, rgba(140,200,255,.35)); }

    #tray { display: flex; align-items: center; height: 100%; color: #fff; text-shadow: 0 0 3px #000; }
    #trayicons { display: flex; align-items: center; gap: 6px; padding-left: 6px; }
    #trayicons img { width: 16px; height: 16px; display: block; }
    #trayicons img[hidden] { display: none; }
    #clock { padding: 0 10px; text-align: center; line-height: 1.35; }
    #showdesk {
      width: 15px; height: 100%; margin-left: 4px; padding: 0; border: 0; border-left: 1px solid rgba(0,0,0,.5);
      background: linear-gradient(90deg, rgba(255,255,255,.25), rgba(255,255,255,.08));
      box-shadow: inset 1px 0 0 rgba(255,255,255,.3); cursor: pointer;
    }
    #showdesk:hover { background: linear-gradient(90deg, rgba(255,255,255,.5), rgba(255,255,255,.2)); }

    /* ---------- Start menu (Windows 7 layout) ---------- */
    #startmenu {
      position: fixed; left: 0; bottom: 40px; width: 424px; max-width: 100vw; height: 520px; max-height: calc(100vh - 70px); z-index: 10000;
      display: flex; padding: 6px 6px 8px 6px; gap: 0;
      border: 1px solid rgba(0,0,0,.75); border-bottom: 0; border-radius: 7px 7px 0 0;
      background: linear-gradient(rgba(60,100,150,.55), rgba(25,45,80,.8));
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.4), 0 0 12px rgba(0,0,0,.55);
      font: 9pt "Segoe UI", Tahoma, sans-serif;
    }
    #startmenu[hidden] { display: none; }
    #startmenu a { text-decoration: none; color: inherit; }

    /* Left column: white program list, then the search box on the glass */
    #startmenu .left { width: 252px; flex: none; display: flex; flex-direction: column; }
    #startmenu .programs {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      background: #fff; border: 1px solid rgba(0,0,0,.55); border-radius: 4px;
      box-shadow: 0 0 0 1px rgba(255,255,255,.45);
    }
    #startmenu .list { flex: 1; overflow: auto; padding: 6px 4px 2px; }
    #startmenu .sep { height: 1px; margin: 4px 8px; background: linear-gradient(90deg, transparent, #d5dfe9 15%, #d5dfe9 85%, transparent); }
    #startmenu .prog {
      display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 6px; color: #000;
      border: 1px solid transparent; border-radius: 3px; cursor: default;
    }
    #startmenu .prog img { width: 32px; height: 32px; flex: none; }
    #startmenu .prog:hover, #startmenu .allprogs:hover {
      border-color: #7da2ce; background: linear-gradient(#dcebfc, #c1dbfc);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.6);
    }
    #startmenu .results-head { padding: 4px 8px 2px; color: #1e395b; font-weight: bold; }
    #startmenu .noresults { padding: 8px; color: #6d6d6d; }
    #startmenu .allprogs {
      display: flex; align-items: center; gap: 8px; height: 30px; margin: 0 4px 4px; padding: 0 8px; color: #000;
      border: 1px solid transparent; border-radius: 3px; cursor: default;
    }
    #startmenu .allprogs .arrow { width: 0; height: 0; border-left: 5px solid #2b2b2b; border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
    #startmenu .allprogs .mag { display: none; width: 12px; height: 12px; }
    #startmenu.searching .allprogs .arrow { display: none; }
    #startmenu.searching .allprogs .mag { display: block; }
    #startmenu.all .allprogs .arrow { border-left: 0; border-right: 5px solid #2b2b2b; }
    #startmenu .searchbox {
      position: relative; height: 26px; margin: 9px 4px 0 2px; display: flex; align-items: center;
      background: #fff; border: 1px solid #8e9fb3; border-radius: 2px; box-shadow: 0 0 0 1px rgba(255,255,255,.35);
    }
    #startmenu .searchbox input {
      all: unset; flex: 1; min-width: 0; height: 100%; padding: 0 6px; font: 9pt "Segoe UI", Tahoma, sans-serif; color: #000;
    }
    #startmenu .searchbox input::placeholder { color: #6d6d6d; font-style: italic; opacity: 1; }
    #startmenu .searchbox svg { width: 14px; height: 14px; margin-right: 6px; flex: none; }

    /* Right column: user picture, folder links, Shut down */
    #startmenu .right { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 46px 0 0 6px; color: #fff; }
    #startmenu .userpic {
      position: absolute; top: -26px; right: 52px; width: 66px; height: 66px; padding: 8px;
      border: 1px solid rgba(0,0,0,.6); border-radius: 6px;
      background: linear-gradient(rgba(255,255,255,.95), rgba(214,229,245,.85) 50%, rgba(190,210,235,.85));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.9), 0 1px 4px rgba(0,0,0,.45);
    }
    #startmenu .userpic img { display: block; width: 48px; height: 48px; border-radius: 2px; }
    #startmenu .userpic img[hidden] { display: none; }
    #startmenu .userpic .blank { width: 48px; height: 48px; border-radius: 2px; background: linear-gradient(#e8f1fb, #b9d2ee); box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
    #startmenu .place {
      display: block; height: 31px; line-height: 29px; padding: 0 10px; margin-right: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      border: 1px solid transparent; border-radius: 3px; cursor: default; text-shadow: 0 0 6px #000, 0 0 2px #000;
    }
    #startmenu .place:hover {
      border-color: rgba(0,0,0,.6);
      background: linear-gradient(rgba(255,255,255,.4), rgba(255,255,255,.15) 50%, rgba(255,255,255,.05) 50%, rgba(255,255,255,.2));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.45);
    }
    #startmenu .rsep { height: 1px; margin: 3px 8px 3px 4px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.3) 20%, rgba(255,255,255,.3) 80%, rgba(255,255,255,0)); box-shadow: 0 -1px 0 rgba(0,0,0,.25); }
    #startmenu .spacer { flex: 1; }
    #startmenu .shutdown { display: flex; height: 24px; margin: 0 6px 0 4px; align-self: flex-start; }
    #startmenu .shutdown div {
      display: flex; align-items: center; justify-content: center; color: #fff; cursor: default; text-shadow: 0 0 4px #000;
      border: 1px solid rgba(0,0,0,.7);
      background: linear-gradient(rgba(255,255,255,.35), rgba(255,255,255,.12) 50%, rgba(0,0,0,.1) 50%, rgba(255,255,255,.15));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.4);
    }
    #startmenu .shutdown .main { padding: 0 14px; border-radius: 3px 0 0 3px; }
    #startmenu .shutdown .more { width: 22px; border-left: 0; border-radius: 0 3px 3px 0; }
    #startmenu .shutdown .more::after { content: ""; border-left: 4px solid #fff; border-top: 4px solid transparent; border-bottom: 4px solid transparent; filter: drop-shadow(0 0 1px #000); }
    #startmenu .shutdown div:hover { background: linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,.25) 50%, rgba(120,190,255,.25) 50%, rgba(160,220,255,.5)); }
    /* ---------- Notification balloon (7.css [role=tooltip], tail pointing down at the tray) ---------- */
    #notify {
      position: fixed; right: 10px; bottom: 58px; z-index: 10001; max-width: calc(100vw - 20px);
      display: flex; align-items: center; gap: 10px; padding: 12px 34px 12px 12px;
      font: 9pt "Segoe UI", Tahoma, sans-serif; color: #000;
      opacity: 1; transition: opacity .4s; cursor: default;
    }
    #notify[hidden] { display: none; }
    #notify::before { right: var(--tail, 12px); }
    #notify.fading { opacity: 0; }
    #notify img { width: 32px; height: 32px; flex: none; }
    #notify .text { font-weight: bold; }
    #notify .close {
      position: absolute; top: 5px; right: 5px; width: 18px; height: 18px; border: 1px solid transparent; border-radius: 3px;
      display: grid; place-items: center; cursor: default; color: #666; font: 13px/1 "Segoe UI", Tahoma, sans-serif;
    }
    #notify .close:hover { color: #000; border-color: #b8b8b8; background: linear-gradient(#fff, #e3e3e3); }
    #notify .close:active { background: linear-gradient(#e3e3e3, #f5f5f5); }

    #start, .task, #showdesk, .icon, #notify .close { -webkit-tap-highlight-color: transparent; outline: none; }
    #start:focus-visible, .task:focus-visible, #showdesk:focus-visible, .icon:focus-visible { outline: 1px dotted #fff; }
    #notify .close:focus-visible { outline: 1px dotted #000; }

    /* ---------- Mobile ---------- */
    @media (max-width: 640px) {
      /* Windows open full-screen above the taskbar */
      .window.app { left: 0 !important; top: 0 !important; width: 100% !important; height: calc(100% - 40px) !important; min-width: 0; }
      .window.app .title-bar-controls button[aria-label="Maximize"],
      .window.app .title-bar-controls button[aria-label="Restore"] { display: none; }

      /* Bigger tap targets for icons */
      #icons { gap: 8px; top: 8px; left: 8px; }
      .icon { width: 84px; padding: 6px 2px; }

      /* Taskbar: buttons share the space */
      .task { width: auto; flex: 1 1 0; max-width: 140px; padding: 0 8px; }
      #showdesk { width: 12px; }

      /* Start menu spans the screen */
      #startmenu { width: 100%; height: 70vh; }
      #startmenu .left { width: auto; flex: 1.35; min-width: 0; }
      #startmenu .right { flex: 1; }
      #startmenu .userpic { right: calc(6px + (100% - 12px) / 2.35 / 2 - 34px); }
    }
  </style>
</head>
<body>

  <div id="desktop">
    <div id="icons">
      <!--
        Desktop icon template. data-open is the id of the window it opens.
        <div class="icon" data-open="win-example"><img src="images/icon.png" alt=""><span>Label</span></div>
      -->
    </div>

    <!--
      Window template (styled by 7.css). Give it an id, a position and a size.
      Add `hidden` to keep it closed until its icon is double-clicked.

      <div class="window glass active app" id="win-example" style="left:120px; top:60px; width:460px; height:320px">
        <div class="title-bar">
          <div class="title-bar-text">Title</div>
          <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
          </div>
        </div>
        <div class="window-body has-space">
          Content
        </div>
      </div>
    -->
  </div>

  <div id="startmenu" hidden>
    <div class="left">
      <div class="programs">
        <div class="list">
          <!-- Pinned programs (data-name is what the search box matches) -->
          <div class="pinned">
            <a class="prog" data-name="Instagram" href="https://www.instagram.com/sunbrightmedia?exln=Y3VqNGJqeGl2OXhv&amp;utm_source=qr" target="_blank" rel="noopener">
              <img src="images/instagram.svg" alt=""><span>Instagram</span>
            </a>
          </div>
          <div class="results" hidden></div>
        </div>
        <div class="sep"></div>
        <div class="allprogs" tabindex="0"><span class="arrow"></span><svg class="mag" viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="#3a6ea5" stroke-width="1.8"/><path d="M10 10l4.2 4.2" stroke="#3a6ea5" stroke-width="2.2" stroke-linecap="round"/></svg><span class="label">All Programs</span></div>
      </div>
      <div class="searchbox">
        <input type="text" placeholder="Search programs and files" aria-label="Search programs and files">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="#3a6ea5" stroke-width="1.8"/><path d="M10 10l4.2 4.2" stroke="#3a6ea5" stroke-width="2.2" stroke-linecap="round"/></svg>
      </div>
    </div>
    <div class="right">
      <div class="userpic"><div class="blank" data-default></div><img alt="" hidden></div>
      <div class="place" data-icon="">SunbrightMedia</div>
      <div class="place" data-icon="images/startmenu/documents.png">Documents</div>
      <div class="place" data-icon="images/startmenu/pictures.png">Pictures</div>
      <div class="place" data-icon="images/startmenu/music.png">Music</div>
      <div class="rsep"></div>
      <div class="place" data-icon="images/startmenu/games.png">Games</div>
      <div class="place" data-icon="images/startmenu/computer.png">Computer</div>
      <div class="rsep"></div>
      <div class="place" data-icon="images/startmenu/control-panel.png">Control Panel</div>
      <div class="place" data-icon="images/startmenu/devices-printers.png">Devices and Printers</div>
      <div class="place" data-icon="">Default Programs</div>
      <div class="place" data-icon="images/startmenu/help.png">Help and Support</div>
      <div class="spacer"></div>
      <div class="shutdown"><div class="main">Shut down</div><div class="more"></div></div>
    </div>
  </div>

  <!-- Mobile-only notification (shown by the script below) -->
  <div id="notify" role="tooltip" class="is-top is-left" hidden>
    <img src="images/info.png" alt="">
    <span class="text">Best viewed on desktop</span>
    <div class="close" tabindex="0" aria-label="Close">✕</div>
  </div>

  <div id="taskbar">
    <div id="start" tabindex="0" aria-label="Start"></div>
    <div id="tasks"></div>
    <div id="tray"><div id="trayicons"><img id="notify-icon" src="images/info-small.png" alt="" hidden></div><div id="clock"></div><div id="showdesk" tabindex="0" aria-label="Show desktop"></div></div>
  </div>

  <script>
    // Taskbar items are plain divs (7.css restyles buttons and [role=button]); make Enter/Space click them
    document.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('#start, .task, #showdesk, #notify .close')) { e.preventDefault(); e.target.click(); }
    });

    // Clock (time over date)
    const clock = document.getElementById('clock');
    // Real day, month and time, but the year always shows as 2014
    const dateFmt = new Intl.DateTimeFormat();
    const tick = () => {
      const d = new Date();
      const date = dateFmt.formatToParts(d).map(p => p.type === 'year' ? '2014' : p.value).join('');
      clock.innerHTML = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '<br class="date"><span class="date">' + date + '</span>';
    };
    tick(); setInterval(tick, 10000);

    // Start menu
    const start = document.getElementById('start'), menu = document.getElementById('startmenu');
    const pinned = menu.querySelector('.pinned'), results = menu.querySelector('.results');
    const allBtn = menu.querySelector('.allprogs'), allLabel = allBtn.querySelector('.label');
    const search = menu.querySelector('.searchbox input');
    function resetMenu() {
      menu.classList.remove('all', 'searching'); allLabel.textContent = 'All Programs';
      search.value = ''; results.hidden = true; pinned.hidden = false;
    }
    function closeMenu() { menu.hidden = true; start.classList.remove('open'); resetMenu(); }
    start.onclick = e => {
      e.stopPropagation();
      if (menu.hidden) { menu.hidden = false; start.classList.add('open'); } else closeMenu();
    };
    document.addEventListener('mousedown', e => {
      if (!menu.hidden && !menu.contains(e.target) && e.target !== start) closeMenu();
    });
    menu.querySelectorAll('a.prog').forEach(a => a.addEventListener('click', closeMenu));

    // All Programs: lists every program A-Z, then becomes "Back"
    const progs = () => [...pinned.querySelectorAll('a.prog')];
    function showList(items, head) {
      results.innerHTML = '';
      if (head) { const h = document.createElement('div'); h.className = 'results-head'; h.textContent = head; results.append(h); }
      if (!items.length) { const n = document.createElement('div'); n.className = 'noresults'; n.textContent = 'No items match your search.'; results.append(n); }
      items.forEach(a => { const c = a.cloneNode(true); c.addEventListener('click', closeMenu); results.append(c); });
      pinned.hidden = true; results.hidden = false;
    }
    allBtn.addEventListener('click', () => {
      if (menu.classList.contains('searching')) return; // "See more results"
      if (menu.classList.toggle('all')) {
        allLabel.textContent = 'Back';
        showList(progs().sort((a, b) => a.dataset.name.localeCompare(b.dataset.name)));
      } else resetMenu();
    });
    allBtn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); allBtn.click(); } });

    // Search programs as you type
    search.addEventListener('input', () => {
      const q = search.value.trim().toLowerCase();
      menu.classList.remove('all');
      menu.classList.toggle('searching', !!q);
      allLabel.textContent = q ? 'See more results' : 'All Programs';
      if (!q) { results.hidden = true; pinned.hidden = false; return; }
      const found = progs().filter(a => a.dataset.name.toLowerCase().includes(q));
      showList(found, found.length ? `Programs (${found.length})` : '');
    });
    search.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeMenu();
      if (e.key === 'Enter') results.querySelector('a.prog')?.click();
    });

    // Hovering a link on the right shows its icon in the user picture frame
    const picImg = menu.querySelector('.userpic img'), picBlank = menu.querySelector('.userpic .blank');
    menu.querySelectorAll('.place').forEach(pl => {
      pl.addEventListener('mouseenter', () => {
        if (pl.dataset.icon) { picImg.src = pl.dataset.icon; picImg.hidden = false; picBlank.hidden = true; }
      });
      pl.addEventListener('mouseleave', () => { picImg.hidden = true; picBlank.hidden = false; });
    });

    // Phone layout (matches the CSS breakpoint); touch devices open icons with one tap
    const isPhone = () => matchMedia('(max-width: 640px)').matches;
    const singleTap = () => matchMedia('(max-width: 640px), (pointer: coarse)').matches;

    // Mobile notification: appears shortly after load, closes after 5 seconds,
    // on its close button, or when any other button is pressed
    const notify = document.getElementById('notify');
    let notifyTimer;
    const notifyIcon = document.getElementById('notify-icon');
    // Like Windows 7, the balloon comes from a (temporary) tray icon and its tail points at it
    function aimNotify() {
      const r = notifyIcon.getBoundingClientRect();
      const want = innerWidth - (r.left + r.width / 2) - 12;            // right offset that puts the tail on the icon
      const right = Math.min(want, innerWidth - notify.offsetWidth - 8); // but keep an 8px gap on the left
      notify.style.right = Math.max(4, right) + 'px';
      notify.style.setProperty('--tail', (12 + want - Math.max(4, right)) + 'px');
    }
    function hideNotify() {
      if (notify.hidden || notify.classList.contains('fading')) return;
      clearTimeout(notifyTimer);
      notify.classList.add('fading');
      setTimeout(() => { notify.hidden = true; notifyIcon.hidden = true; }, 400);
    }
    if (isPhone()) {
      setTimeout(() => {
        notifyIcon.hidden = false;
        notify.hidden = false;
        aimNotify();
        notifyTimer = setTimeout(hideNotify, 5000);
      }, 800);
    }
    addEventListener('resize', () => { if (!notify.hidden) aimNotify(); });
    // Clicking anywhere on the balloon dismisses it, as in Windows 7
    notify.addEventListener('click', hideNotify);
    document.addEventListener('pointerdown', e => {
      if (!notify.hidden && !notify.contains(e.target) &&
          e.target.closest('button, a, input, #start, .task, #showdesk, .icon')) hideNotify();
    }, true);

    // Windows
    const tasks = document.getElementById('tasks');
    let z = 10;
    function focusWin(w) {
      document.querySelectorAll('.window.app').forEach(o => o.classList.toggle('active', o === w));
      document.querySelectorAll('.task').forEach(t => t.classList.toggle('active', t._win === w));
      w.style.zIndex = ++z;
    }
    function taskFor(w) {
      if (w._task) return w._task;
      const t = document.createElement('div');
      t.className = 'task'; t._win = w; t.tabIndex = 0;
      t.textContent = w.querySelector('.title-bar-text')?.textContent.trim() || '';
      t.onclick = () => {
        if (w.hidden) { w.hidden = false; focusWin(w); }
        else if (t.classList.contains('active')) { w.hidden = true; t.classList.remove('active'); }
        else focusWin(w);
      };
      tasks.appendChild(t);
      return (w._task = t);
    }
    function openWin(w) { w.hidden = false; taskFor(w); focusWin(w); }

    document.querySelectorAll('.window.app').forEach(w => {
      if (!w.hidden) taskFor(w);
      w.addEventListener('mousedown', () => focusWin(w));
      const bar = w.querySelector('.title-bar');
      const btn = l => w.querySelector(`.title-bar-controls button[aria-label="${l}"]`);
      bar.addEventListener('pointerdown', e => {
        if (e.target.closest('button') || w.dataset.max || isPhone()) return;
        const dx = e.clientX - w.offsetLeft, dy = e.clientY - w.offsetTop;
        const move = ev => { w.style.left = ev.clientX - dx + 'px'; w.style.top = Math.max(0, ev.clientY - dy) + 'px'; };
        const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
        addEventListener('pointermove', move); addEventListener('pointerup', up);
      });
      btn('Minimize')?.addEventListener('click', () => { w.hidden = true; w._task?.classList.remove('active'); });
      btn('Close')?.addEventListener('click', () => { w.hidden = true; w._task?.remove(); w._task = null; });
      const toggleMax = () => {
        const m = btn('Maximize') || btn('Restore');
        if (w.dataset.max) { w.style.cssText = w.dataset.max; delete w.dataset.max; m?.setAttribute('aria-label', 'Maximize'); }
        else {
          w.dataset.max = w.style.cssText;
          Object.assign(w.style, { left: 0, top: 0, width: '100%', height: 'calc(100% - 40px)' });
          m?.setAttribute('aria-label', 'Restore');
        }
        focusWin(w);
      };
      (btn('Maximize') || btn('Restore'))?.addEventListener('click', toggleMax);
      bar.addEventListener('dblclick', e => { if (!e.target.closest('button') && !isPhone()) toggleMax(); });
    });
    const wins = [...document.querySelectorAll('.window.app:not([hidden])')];
    if (wins.length) focusWin(wins[wins.length - 1]);

    // Show desktop: minimize everything
    document.getElementById('showdesk').onclick = () => document.querySelectorAll('.window.app').forEach(w => {
      w.hidden = true; w._task?.classList.remove('active');
    });

    // Desktop icons: click to select, double-click to open
    document.querySelectorAll('.icon').forEach(i => {
      const open = () => { const w = document.getElementById(i.dataset.open); if (w) openWin(w); };
      i.addEventListener('click', () => {
        document.querySelectorAll('.icon').forEach(o => o.classList.toggle('selected', o === i));
        if (singleTap()) open();
      });
      i.addEventListener('dblclick', () => { if (!singleTap()) open(); });
    });
    document.getElementById('desktop').addEventListener('mousedown', e => {
      if (!e.target.closest('.icon')) document.querySelectorAll('.icon').forEach(o => o.classList.remove('selected'));
    });
  </script>
</body>
</html>
